<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Гектабайт{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}" class="logo">Гектабайт</a>
            <a href="{{ url_for('about') }}">О проекте</a>
            <a href="{{ url_for('login') }}" class="btn">Войти</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Гектабайт — ваше хозяйство в гектабайтах. © 2026</p>
    </footer>
</body>
</html>
